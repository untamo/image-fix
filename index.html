<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Remove distracting horizontal lines from an image in your browser."
    />
    <meta name="theme-color" content="#0d1014" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <title>LineLift — remove image lines</title>
    <link rel="stylesheet" href="styles.css?v=android-install-1" />
  </head>
  <body>
    <main class="page-shell" id="editorShell">
      <section class="canvas-panel" aria-label="Image editor">
        <input id="fileInput" type="file" accept="image/*" hidden />
        <div class="dropzone" id="dropzone">
          <button class="load-image" id="chooseButton" type="button">
            <span class="dropzone-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <rect x="4" y="5" width="24" height="22" rx="4" stroke="currentColor" stroke-width="1.8" />
                <circle cx="11" cy="12" r="2.2" stroke="currentColor" stroke-width="1.8" />
                <path d="m7 24 6.2-6 4.1 3.7 2.8-2.8L26 25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <strong>Choose image</strong>
            <span class="load-hint">or drop it here</span>
          </button>
        </div>

        <div class="canvas-area hidden" id="canvasArea">
          <div class="image-viewport">
            <div class="canvas-stage" id="canvasStage">
              <canvas id="previewCanvas" aria-label="Fisheye image preview centered on one selected pixel row"></canvas>
              <canvas id="guideCanvas" aria-hidden="true"></canvas>
            </div>
            <div class="focus-navigation hidden" id="focusNavigation" role="group" aria-label="Select a horizontal line">
              <button class="button focus-arrow" id="previousLineButton" type="button" aria-label="Select previous line above" disabled>↑</button>
              <button class="button focus-arrow" id="nextLineButton" type="button" aria-label="Select next line below" disabled>↓</button>
            </div>
            <div class="image-actions" id="editorToolbar" role="toolbar" aria-label="Image actions" aria-orientation="vertical">
              <button class="button image-action" id="previewRepairButton" type="button" aria-label="Preview" title="Preview" aria-pressed="false" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
              <button class="button image-action image-action-primary" id="removeButton" type="button" aria-label="Fix" title="Fix" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m4 17 12-12 4 4L8 21Z M13 8l4 4" />
                  <path d="M5 3v4M3 5h4M18 2v4M16 4h4M20 16v4M18 18h4" />
                </svg>
              </button>
              <button class="button image-action" id="downloadButton" type="button" aria-label="Save" title="Save PNG" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3" />
                </svg>
              </button>
            </div>
          </div>
          <div class="sensitivity-dock" id="controlsPanel">
            <div class="control-label-row">
              <label for="sensitivity">Sensitivity</label>
              <output id="sensitivityValue" for="sensitivity">60%</output>
            </div>
            <input id="sensitivity" type="range" min="10" max="95" value="60" />
          </div>
        </div>

        <div class="sr-only">
          <span id="statusText" role="status" aria-live="polite">Waiting for an image</span>
          <span id="selectedLineStatus" role="status" aria-live="polite">No lines detected</span>
          <span id="guideSummary" aria-live="polite">Detected lines will appear as guides</span>
        </div>
        <p class="notice notice-error hidden" id="errorNotice" role="alert"></p>
      </section>
    </main>

    <script src="app.js?v=android-install-1"></script>
    <script src="pwa.js?v=android-install-1"></script>
  </body>
</html>
